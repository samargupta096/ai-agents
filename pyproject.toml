[project]
name = "dev_agents"
version = "0.1.0"
description = "AI agents for software engineers powered by local LLMs via Ollama"
authors = [{ name = "Samarpit Gupta", email = "samarguptag@gmail.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.86.0,<1.0.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dev_agents = "dev_agents.main:run"
generate = "dev_agents.main:generate"
review = "dev_agents.main:review"
debug = "dev_agents.main:debug_code"
test_gen = "dev_agents.main:generate_tests"
docs = "dev_agents.main:generate_docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
